name: Deploy GitHub Pages

on:
  push:
    branches:
      - develop
  # Daily rebuild at 13:05 UTC. The build skips posts dated in the future, so
  # this run is what actually releases each day's post — no merge required.
  # GitHub queues scheduled runs and can delay them under load, so treat this
  # as "shortly after", not exact. Adjust the hour to suit your timezone.
  #
  # Note: GitHub only fires `schedule` from the workflow file on the DEFAULT
  # branch. If develop is not the default branch, this file must also exist on
  # the default branch or the daily release never runs. The checkout below is
  # pinned to develop so it builds the right content either way.
  schedule:
    - cron: "5 13 * * *"
  # Manual run, for releasing a post early or re-deploying after a fix.
  workflow_dispatch:

# GITHUB_TOKEN starts read-only; deploy-pages needs `pages: write` to publish
# and `id-token: write` to mint the OIDC token Pages verifies the upload with.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling them. A cancelled deploy can leave Pages
# serving a partially-uploaded artifact, so in-flight runs are allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        env:
          # Absolute base for canonical and Open Graph URLs. Set the SITE_URL
          # repository variable when a custom domain is in use.
          SITE_URL: ${{ vars.SITE_URL }}
          OG_IMAGE: ${{ vars.OG_IMAGE }}
        run: python tools/build.py

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # Creates the Pages site on the first run if it does not already
          # exist, and sets its build source to GitHub Actions. Without this
          # the deploy fails until someone enables Pages in Settings by hand.
          # Note this makes the workflow itself publish a public website.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Announce newly published posts to Facebook. Runs only after a successful
  # deploy, so the link in the post cannot 404. Safe to run on every push and
  # every cron tick: content/announced.json records what has already gone out,
  # and the script posts nothing that is already in it.
  announce:
    needs: deploy
    runs-on: ubuntu-latest
    # Only this job can write to the repository, and only to commit the ledger.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Announce new posts
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_API_VERSION: ${{ vars.FB_API_VERSION }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python tools/announce.py

      - name: Record what was announced
        run: |
          if git diff --quiet -- content/announced.json; then
            echo "ledger unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/announced.json
          # Commits made with GITHUB_TOKEN do not themselves trigger workflows,
          # so this cannot loop. [skip ci] is belt and braces.
          git commit -m "Record Facebook announcements [skip ci]"
          git push origin HEAD:develop
