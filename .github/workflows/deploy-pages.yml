name: Deploy GitHub Pages

on:
  push:
    branches:
      - develop
  # Lets you re-deploy the current develop tip from the Actions tab without
  # having to push an empty commit.
  workflow_dispatch:

# GITHUB_TOKEN starts read-only; deploy-pages needs `pages: write` to publish
# and `id-token: write` to mint the OIDC token Pages verifies the upload with.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling them. A cancelled deploy can leave Pages
# serving a partially-uploaded artifact, so in-flight runs are allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # No build step: site/ is plain HTML and CSS, so it ships as-is.
      # Adding a generator later means running it here and pointing the upload
      # below at its output directory instead of site/.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
