<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — parts-master.io</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>"
    />
    <!-- Styles are inlined rather than linked. Pages serves this file for any
         missing path, and a relative href would resolve against that path
         (/a/b/styles.css) instead of the site root. -->
    <style>
      :root {
        --bg: #fbfbfd;
        --text: #16161d;
        --muted: #5f6070;
        --accent: #b4530a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0e13;
          --text: #f2f2f6;
          --muted: #a0a1b2;
          --accent: #f2a15e;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      .code {
        display: block;
        font-size: clamp(3.5rem, 14vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        color: var(--accent);
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: clamp(1.25rem, 4vw, 1.5rem);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div>
      <span class="code">404</span>
      <h1>Page not found</h1>
      <p><a id="home" href="/">Back to parts-master.io</a></p>
    </div>
    <script>
      // On a project Pages site the root is /<repo>/, on a custom domain it is
      // /. Point the link at whichever this is actually being served from.
      (function () {
        var h = location.hostname,
          base = "/";
        if (h.endsWith(".github.io")) {
          var seg = location.pathname.split("/")[1];
          if (seg) base = "/" + seg + "/";
        }
        document.getElementById("home").setAttribute("href", base);
      })();
    </script>
  </body>
</html>
